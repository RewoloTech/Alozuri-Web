# App Hosting target: apps/web. Root turbo.json enables monorepo detection.
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512
# Configure NEXT_PUBLIC_FIREBASE_* and NEXT_PUBLIC_API_URL in the hosting
# environment before building. Live catalogue and Stripe configuration; the API checks supplier credit before charging.
env:
  # Country is only an initial currency hint; IP Geolocation must be enabled at Cloudflare.
  - variable: CURRENCY_GEO_PROVIDER
    value: cloudflare
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: 'false'
  - variable: NEXT_PUBLIC_API_URL
    value: https://alozuri-api-rnm3hsyqia-ez.a.run.app
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://alozuri.com

  - variable: NEXT_PUBLIC_PAYMENT_MODE
    value: live

  # Public browser configuration for the Alozuri Firebase web app.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: 'AIzaSyA2V-oXF0NZhveO0JkyVN0uF3PtoL7eQaw'
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: 'alozuri.firebaseapp.com'
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: 'alozuri'
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: 'alozuri.firebasestorage.app'
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '259378235356'
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: '1:259378235356:web:c0ed788084546d350ff119'
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: 'G-ZVWR8NWVWF'

  # Set the matching Stripe publishable key in the backend build environment.
  # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_... (test) or pk_live_... (live)
  # Live deployment values are documented in docs/production-checkout.md.
