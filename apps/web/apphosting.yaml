# App Hosting target: apps/web. Root turbo.json enables monorepo detection.
runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512
# Configure NEXT_PUBLIC_FIREBASE_* and NEXT_PUBLIC_API_URL in the hosting
# environment before building. Keep NEXT_PUBLIC_DEMO_MODE=true for preview.
env:
  - variable: NEXT_PUBLIC_DEMO_MODE
    value: 'false'
  - variable: NEXT_PUBLIC_API_URL
    value: https://voyaspan-api-g74tu22y5q-ez.a.run.app
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://voyaspan--voyaspan.europe-west4.hosted.app

  - variable: NEXT_PUBLIC_PAYMENT_MODE
    value: test
