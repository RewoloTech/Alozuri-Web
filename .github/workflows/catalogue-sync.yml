name: Daily supplier catalogue sync
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: catalogue-sync-esim-access
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_CLOUD_PROJECT: alozuri
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: alozuri
          workload_identity_provider: projects/259378235356/locations/global/workloadIdentityPools/alozuri-github/providers/catalogue
          service_account: alozuri-catalogue@alozuri.iam.gserviceaccount.com
      - run: node --import tsx scripts/sync-catalogue.mts
