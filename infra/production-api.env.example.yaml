# Copy to a local file, fill in actual values, and deploy it with the API.
# Secret values belong in Secret Manager, not this file.
GOOGLE_CLOUD_PROJECT: alozuri
DEMO_MODE: 'false'
# Set live only after the approved worker/queue and live webhook are configured.
PAYMENTS_MODE: disabled
SITE_URL: https://alozuri.com
CORS_ORIGINS: https://alozuri.com
FULFILLMENT_ENABLED: 'true'
FULFILLMENT_WORKER_AUDIENCE: https://YOUR_ALOZURI_API/internal/fulfillment/run
FULFILLMENT_WORKER_SERVICE_ACCOUNT: alozuri-scheduler@alozuri.iam.gserviceaccount.com
CATALOGUE_SYNC_AUDIENCE: https://YOUR_ALOZURI_API/internal/catalogue/sync
CATALOGUE_SYNC_SERVICE_ACCOUNT: alozuri-scheduler@alozuri.iam.gserviceaccount.com

# Migration default: leaves existing production processing unchanged.
# After explicit approval, create/configure the queue, deploy queue mode, migrate
# pending work and retire the fulfillment scheduler as in docs/order-processing.md.
ORDER_PROCESSING_MODE: scheduler
# ORDER_PROCESSING_MODE: queue
# ORDER_TASK_QUEUE: projects/alozuri/locations/europe-west4/queues/alozuri-orders
# ORDER_TASK_WORKER_URL: https://YOUR_ALOZURI_API/internal/orders/process
# ORDER_TASK_AUDIENCE: https://YOUR_ALOZURI_API
# ORDER_TASK_SERVICE_ACCOUNT: alozuri-order-worker@alozuri.iam.gserviceaccount.com

# Confirmation sender is fixed to Alozuri <orders@alozuri.com>.
